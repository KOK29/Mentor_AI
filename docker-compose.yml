services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/mentor_slm.db
      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
      DEV_OTP_MODE: ${DEV_OTP_MODE:-1}
      CORS_ORIGINS: http://localhost,http://localhost:5173
      SLM_BASE_URL: ${SLM_BASE_URL:-http://host.docker.internal:11434}
      SLM_MODEL: ${SLM_MODEL:-qwen2.5:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mentor_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mentor_data:
